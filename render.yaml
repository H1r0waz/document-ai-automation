services:
  - type: web
    name: document-api
    plan: free
    runtime: docker
    rootDir: document-api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/documents
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: APP_ORIGIN
        sync: false

  - type: web
    name: document-extractor
    plan: free
    runtime: docker
    rootDir: extractor
    dockerfilePath: ./Dockerfile

  - type: web
    name: document-automation-n8n
    plan: free
    runtime: docker
    rootDir: n8n
    dockerfilePath: ./Dockerfile
    envVars:
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: N8N_HOST
        sync: false
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_PORT
        value: "10000"
      - key: WEBHOOK_URL
        sync: false
      - key: EXTRACTOR_URL
        sync: false
      - key: DOCUMENT_API_URL
        sync: false
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        sync: false
      - key: DB_POSTGRESDB_DATABASE
        sync: false
      - key: DB_POSTGRESDB_SCHEMA
        value: n8n
      - key: DB_POSTGRESDB_USER
        sync: false
      - key: DB_POSTGRESDB_PASSWORD
        sync: false
      - key: DB_POSTGRESDB_SSL_ENABLED
        value: "true"
