server {
  listen 80;
  client_max_body_size 20m;

  location /api/ {
    proxy_pass http://document-api:8080;
    proxy_set_header Host $host;
  }

  location /workflow/ {
    proxy_pass http://n8n:5678/;
    proxy_set_header Host $host;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
